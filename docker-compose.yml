version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: changeguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: changeguard
      POSTGRES_PASSWORD: changeguard_password
      POSTGRES_DB: changeguard
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U changeguard -d changeguard']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: changeguard-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
