metadata:
  name: changeguard-service
  namespace: changeguard
  labels:
    app.kubernetes.io/name: changeguard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: changeguard
    app.kubernetes.io/component: api-server
