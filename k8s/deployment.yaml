apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeguard-api
  namespace: changeguard
  labels:
    app.kubernetes.io/name: changeguard
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: changeguard-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: changeguard
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changeguard
        app.kubernetes.io/component: api-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: changeguard
          image: ghcr.io/varadmadhav/changeguard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: changeguard-config
            - secretRef:
                name: changeguard-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
