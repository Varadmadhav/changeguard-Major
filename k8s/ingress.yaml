apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changeguard-ingress
  namespace: changeguard
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.changeguard.internal
      secretName: changeguard-tls-cert
  rules:
    - host: app.changeguard.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: changeguard-service
                port:
                  name: http
